<!DOCTYPE html>
<html lang="es">

<title>Minuta Comercial Andinamotors</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin:0;

}

header {
    background:#002060;
    color:white;

.container {

.card {

.tag-ok { color:green; font-weight:bold; }
